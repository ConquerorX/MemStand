name: "💡 Feature Request"
description: "Suggest an idea or enhancement for MemStand"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome community suggestions and ideas to make MemStand even faster and more versatile!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: "e.g. I'm always frustrated when..."
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Enhancement
      description: Describe what you would like MemStand to do.
      placeholder: "e.g. Add a tray action for..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Describe any alternative solutions or workarounds you've thought of.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional Context / Mockups
      description: Any other context, API references, or mockups.
