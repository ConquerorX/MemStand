name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in MemStand"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue! Please fill out the form below to help us reproduce and resolve the problem quickly.
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What version of Windows are you running?
      options:
        - Windows 11 (24H2 / latest)
        - Windows 11 (23H2 / 22H2)
        - Windows 10 (22H2 / 21H2)
        - Other (specify in description)
    validations:
      required: true
  - type: input
    id: ram_amount
    attributes:
      label: Installed Physical Memory (RAM)
      description: e.g. 16 GB, 32 GB, 64 GB
      placeholder: "e.g. 32 GB DDR5"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: MemStand Version
      description: Check the footer or release tag (e.g. v1.0.0)
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      value: |
        1. Launch MemStand with '...'
        2. Click on '...'
        3. Observe '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context / Screenshots
      description: Add any relevant screenshots, logs, or antivirus interference context here.
